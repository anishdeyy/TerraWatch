version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: darukaa-postgis
    environment:
      POSTGRES_DB: darukaa_earth
      POSTGRES_USER: darukaa_user
      POSTGRES_PASSWORD: darukaa_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/seed.sql:/docker-entrypoint-initdb.d/01-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darukaa_user -d darukaa_earth"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - darukaa-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: darukaa-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://darukaa_user:darukaa_secure_password_2026@postgres:5432/darukaa_earth
      - JWT_SECRET=darukaa_earth_jwt_super_secret_key_prod_2026!
      - JWT_EXPIRE_MINUTES=10080
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_placeholder}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - darukaa-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: darukaa-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_RAZORPAY_KEY_ID=rzp_test_TbDBOhjF9vRYEg
    depends_on:
      - backend
    networks:
      - darukaa-network

volumes:
  postgres_data:

networks:
  darukaa-network:
    driver: bridge
