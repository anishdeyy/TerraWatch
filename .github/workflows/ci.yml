name: Continuous Integration

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend-checks:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install -r backend/requirements.txt

      - name: Run Ruff Lint & Format Check
        run: |
          ruff check backend/
          ruff format --check backend/

      - name: Run Pytest Suite
        env:
          DATABASE_URL: sqlite:///./test.db
          JWT_SECRET: test_jwt_secret_key_32_bytes_long!!
          RAZORPAY_KEY_ID: rzp_test_dummy
          RAZORPAY_KEY_SECRET: test_secret
        run: |
          pytest backend/tests/ -v

  frontend-checks:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Prettier & ESLint Checks
        working-directory: frontend
        run: |
          npm run lint || true

      - name: Build Frontend Application
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8000
          VITE_RAZORPAY_KEY_ID: rzp_test_TbDBOhjF9vRYEg
        run: npm run build

  docker-build-check:
    name: Docker Images Build Verification
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t darukaa-backend:test ./backend

      - name: Build Frontend Docker Image
        run: docker build -t darukaa-frontend:test ./frontend
